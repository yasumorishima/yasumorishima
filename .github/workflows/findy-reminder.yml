name: Findy Skill Deviation Reminder

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      memo:
        description: "Manual run reason"
        required: true

permissions:
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create reminder issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MONTH=$(date -u +"%Y-%m")
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Findy偏差値チェック ${MONTH}" \
            --body "$(cat <<'EOF'
          README の Findy Skill Deviation バッジを最新化してください。

          - スキルシェアページ: https://findy-code.io/skills-share/f6fUT0vdoVeI4
          - 更新箇所: `README.md` 冒頭のバッジ（帯と日付/具体値）
          - 規約上スクレイピング不可のため手動更新です
          EOF
          )"
